# Per-IP rate limit zone for ask-yoni. Must be at http{} level — drop this
# file in /etc/nginx/conf.d/ so it loads before any server{} that uses it.
#
# 60 req/min/IP with bursts up to 20 covers Claude.ai's session-init traffic
# while bounding worst-case OpenAI embedding spend.
limit_req_zone $binary_remote_addr zone=ask_yoni:10m rate=60r/m;
