# Public nginx server block for the ask-yoni MCP service.
#
# Drop in at /etc/nginx/sites-available/ask-yoni and symlink to sites-enabled.
# Assumes:
#   - DNS A records yoni.fyi + www.yoni.fyi -> droplet IP
#   - Certbot has provisioned /etc/letsencrypt/live/yoni.fyi/
#   - The Python service binds 127.0.0.1:8091 (see scripts/ask-yoni.service)
#
# Security model: this is a PUBLIC MCP endpoint. No auth, no IP allowlist.
# Abuse is bounded by per-IP rate limit (see limit_req zone below) plus the
# low marginal cost of OpenAI embeddings.

# Rate limit zone for ask-yoni. Must be declared at http{} level. Put this
# in /etc/nginx/conf.d/ratelimit-ask-yoni.conf or in nginx.conf:
#     limit_req_zone $binary_remote_addr zone=ask_yoni:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yoni.fyi www.yoni.fyi;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yoni.fyi www.yoni.fyi;

    ssl_certificate     /etc/letsencrypt/live/yoni.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoni.fyi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_log /var/log/nginx/ask-yoni.error.log;

    # Streamable HTTP / SSE needs long-lived connections + no buffering.
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # MCP endpoint. Public, rate-limited per IP.
    location /mcp {
        limit_req zone=ask_yoni burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
    }
    location /mcp/ {
        limit_req zone=ask_yoni burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
    }

    # Friendly landing page at the root.
    location = / {
        default_type text/plain;
        return 200 "ask yoni — a public MCP server over Yoni Rechtman's writing on 99% Derisible.\n\nAdd https://yoni.fyi/mcp to your Claude.ai connectors.\n\nSource: https://99d.substack.com\n";
    }

    location / {
        return 404;
    }
}
