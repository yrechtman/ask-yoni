# HTTP-only stub for the certbot --webroot bootstrap on first install.
# Drop in at /etc/nginx/sites-available/ask-yoni and symlink to sites-enabled,
# then run: certbot certonly --webroot -w /var/www/html -d yoni.fyi -d www.yoni.fyi
# After cert is issued, replace this with nginx-ask-yoni.conf.

server {
    listen 80;
    listen [::]:80;
    server_name yoni.fyi www.yoni.fyi;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
